<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Sankalp</title>
<meta name="description" content="Sankalp: tasks, habits, focus and insights in one calm app.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sankalp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontlink" rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF;--surface:#F2F3F7;--line:#E6E8EF;--ink:#121826;--muted:#5B6170;--soft:#3D4352;
  --accent:#F2A33A;--accent-text:#B45309;--on-accent:#121826;--meet:#5B5BD6;--ring:#C5C9D3;
  --danger:#B93815;--card:#FFFFFF;--shadow:rgba(18,24,38,.22);
  --fd:'Bricolage Grotesque',system-ui,sans-serif;--fb:'Plus Jakarta Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
a.navi,a.btn,a.pill,a.iconbtn,a.back{text-decoration:none}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:8px}
.display,h1,h2{font-family:var(--fd)}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;max-width:800px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 0 170px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:272px;flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 12px 40px}
  main{padding-top:18px}
  .only-mobile{display:none!important}
}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.brand b{font-family:var(--fd);font-weight:800;font-size:24px;letter-spacing:-.02em}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0 8px;min-height:52px;gap:6px}
.topbar .acts{display:flex;align-items:center}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;color:var(--ink)}
.iconbtn:hover{background:var(--surface)}
.iconbtn.on{color:var(--accent-text)}
.back{height:44px;display:inline-flex;align-items:center;gap:6px;padding:0 6px;font-weight:700;font-size:17px}
.pad{padding:0 24px}
h1.title{margin:4px 0 0;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2.sec{margin:0;font-size:20px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 24px 4px;gap:10px}
.sechead .muted{font-size:13px;font-weight:600}
.sub{font-size:14px;color:var(--muted)}

/* date hero */
.datehero{display:flex;align-items:center;gap:14px;padding:0 24px 12px}
.datehero .num{font-family:var(--fd);font-size:80px;font-weight:800;line-height:.9;letter-spacing:-.05em}
.datehero h1{margin:0;font-size:24px;font-weight:700;line-height:1.1}

/* intent card */
.intent{margin:0 20px 14px;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.intent button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}
.intent button:last-child{border-bottom:0}
.intent .ie{font-size:20px;line-height:1.2;width:24px;text-align:center;flex:none}
.intent .il{display:flex;flex-direction:column;gap:1px;min-width:0}
.intent .il small{font-size:12px;font-weight:700;color:var(--muted)}
.intent .il span{font-size:15.5px;font-weight:600;word-break:break-word}
.intent .il span.ph{color:var(--muted);font-weight:500}
.ekbtn{margin:0 20px 6px;display:flex;align-items:center;gap:12px;width:calc(100% - 40px);padding:12px 14px;border-radius:16px;background:var(--ink);color:var(--bg);text-align:left}
.ekbtn .ek-ic{width:36px;height:36px;border-radius:18px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;flex:none}
.ekbtn b{display:block;font-size:15.5px}
.ekbtn span{font-size:12.5px;opacity:.8}

/* day band */
.band{background:var(--surface);padding:14px 20px 16px;display:flex;flex-direction:column;gap:8px;margin-top:6px}
@media (min-width:900px){.band{margin:6px 24px 0;border-radius:18px}}
.band .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.band .bh b{font-size:15px}
.band .bh span{font-size:13px;color:var(--muted)}
.bar{position:relative;height:74px;margin-top:2px}
.bar .track{position:absolute;left:0;right:0;top:24px;height:34px;border-radius:10px;background:var(--card);overflow:hidden}
.bar .past{position:absolute;left:0;top:0;bottom:0;background:var(--line)}
.bar .blk{position:absolute;top:5px;bottom:5px;border-radius:5px;min-width:5px}
.bar .blk.meet{background:var(--meet)}
.bar .blk.focus{background:var(--accent)}
.bar .tick{position:absolute;bottom:3px;width:6px;height:6px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.bar .now{position:absolute;top:20px;height:42px;width:2px;margin-left:-1px;background:var(--ink)}
.bar .nowlbl{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap}
.bar .scale{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:10.5px;font-weight:600;color:var(--muted)}
.bar .scale span{position:absolute;transform:translateX(-50%)}
.bar .scale span:first-child{transform:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--soft)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.nextcard{background:var(--card);border-radius:14px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;margin-top:4px}
.nextcard .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--meet)}
.nextcard .t{font-size:15px;font-weight:700}
.nextcard .s{font-size:12.5px;color:var(--muted)}
.bandnote{font-size:13px;font-weight:600;color:var(--soft)}
.pill{height:36px;padding:0 16px;border-radius:18px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex:none}
.pill.meet{background:var(--meet);color:#fff}
.pill.ink{background:var(--ink);color:var(--bg)}
.pill.ghost{border:1px solid var(--line);background:var(--card)}
.pill.acc{background:var(--accent);color:var(--on-accent)}
.pill svg{width:16px;height:16px}

/* grouping control */
.groupbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 24px 0;flex-wrap:wrap}
.groupbar h2{white-space:nowrap}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-width:0;height:36px;padding:0 10px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* task rows */
.list{padding:0 20px}
.row{display:flex;align-items:flex-start;gap:2px;position:relative;background:var(--bg);touch-action:pan-y;transition:transform .18s ease}
.row.dragging{transition:none}
.chk{width:40px;height:46px;flex:none;display:grid;place-items:center}
.chk::before{content:'';grid-area:1/1;width:22px;height:22px;border-radius:11px;border:2px solid var(--ring);box-sizing:border-box}
.chk svg{grid-area:1/1;width:13px;height:13px;position:relative}
.chk.p1::before{border-color:var(--danger)}
.chk.p2::before{border-color:var(--accent-text)}
.chk.p3::before{border-color:var(--meet)}
.row.done .chk::before{background:var(--accent);border-color:var(--accent)}
.row.done .chk svg{color:var(--on-accent)}
.rbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px 0 10px}
.rt{font-size:17px;font-weight:600;line-height:1.3;word-break:break-word}
.row.done .rt{color:var(--muted);text-decoration:line-through;font-weight:500}
.rm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.rm .mi{display:inline-flex;align-items:center;gap:3px}
.rm .mi svg{width:12px;height:12px}
.rm .late{color:var(--danger);font-weight:700}
.rm .proj{font-weight:600;color:var(--soft)}
.rm .star{color:var(--accent-text);font-weight:700}
.subtog{height:46px;padding:0 6px;display:flex;align-items:center;gap:3px;font-size:12.5px;font-weight:700;color:var(--muted);flex:none}
.subtog svg{width:14px;height:14px;transition:transform .15s}
.subtog.open svg{transform:rotate(90deg)}
.subs{margin:-4px 0 6px 42px;border-left:2px solid var(--line);padding-left:6px}
.subrow{display:flex;align-items:center;gap:10px;min-height:38px;width:100%;text-align:left;font-size:15px}
.subrow i{width:18px;height:18px;border-radius:6px;border:2px solid var(--ring);flex:none;display:grid;place-items:center}
.subrow.d i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.subrow.d span{text-decoration:line-through;color:var(--muted)}
.subrow svg{width:11px;height:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;flex:none}
.empty{padding:22px 24px;color:var(--muted);font-size:15px;line-height:1.5}
.empty b{color:var(--ink)}
.grouph{display:flex;align-items:center;gap:8px;padding:16px 24px 2px;font-size:14px;font-weight:700;color:var(--soft)}
.grouph .cnt{color:var(--muted);font-weight:600}
.doneh{display:flex;align-items:center;justify-content:space-between;padding:18px 24px 2px;font-size:14px;font-weight:700;color:var(--muted);width:100%}

/* home */
.hello{padding:14px 24px 0;display:flex;flex-direction:column;gap:14px}
.hello p{margin:0;font-family:var(--fd);font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;padding:0 14px}
.navi{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 10px;border-radius:12px;font-size:17px;font-weight:600;width:100%;text-align:left}
.navi:hover{background:var(--surface)}
.navi svg{width:20px;height:20px;flex:none}
.navi .c{font-size:15px;font-weight:500;color:var(--muted)}
.navi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi.on{background:var(--sel);color:var(--ink)}
.navi.on .c{color:var(--ink)}
.navi .bad{min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.navi .pe{width:20px;text-align:center;font-size:17px;line-height:1;flex:none}
.area{margin:18px 10px 4px 24px;font-family:var(--fd);font-size:20px;font-weight:700}
.side .area{margin-left:10px;font-size:16px}
.side .navi{font-size:15px;min-height:40px}
.sidesearch{display:flex;align-items:center;gap:8px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);padding:0 12px;color:var(--muted);font-size:14.5px;margin:0 0 12px;width:100%;text-align:left}
.sidesearch kbd{margin-left:auto;font-family:inherit;font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 5px}

/* FAB */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:29px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;box-shadow:0 10px 24px var(--shadow);z-index:31}
.fab span{display:none}
@media (min-width:900px){.fab{bottom:28px;right:28px}}
@media (min-width:1280px){.fab{right:calc(340px + 28px)}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:46;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:50;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding:6px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
@media (min-width:700px){.sheet{left:50%;right:auto;width:620px;margin-left:-310px;bottom:auto;top:6vh;max-height:88vh;border-radius:22px;transform:translateY(20px);opacity:0;transition:transform .2s,opacity .2s}.sheet.on{transform:none;opacity:1}}
.shead{position:sticky;top:-6px;z-index:2;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 -20px 6px;padding:8px 12px 6px;border-bottom:1px solid var(--line)}
.shead .ttl{font-family:var(--fd);font-weight:700;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead .cx{justify-self:start;height:40px;padding:0 10px;font-weight:600;color:var(--muted);font-size:15.5px}
.shead .ok{justify-self:end;height:36px;padding:0 16px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14.5px}
.shead .ok:disabled{opacity:.35}
.shead .qa-r{justify-self:end;display:flex;align-items:center;gap:4px}
.shead .qa-x{width:36px;height:36px;color:var(--soft)}
.shead .qa-x:disabled{opacity:.35}
.qa-in{display:flex;gap:6px;align-items:flex-start}
.qa-note{width:100%;border:0;outline:none;background:transparent;font:inherit;font-size:15px;color:var(--soft);resize:none;padding:0 0 8px;line-height:1.45;min-height:24px;overflow:hidden}
.qa-note::placeholder{color:var(--muted);opacity:.8}
.qa-wrap{position:relative}
.chip.ed{cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;border:0}
.chip.ed::after{content:'▾';margin-left:4px;opacity:.55;font-size:10px}
.chip.ghost{background:transparent!important;border:1px dashed var(--line)!important;color:var(--muted)}
.chip.ghost::after{content:''}
.qa-hid{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;bottom:0;left:0}
.qa-pick{position:absolute;left:0;right:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.18);max-height:252px;overflow:auto;padding:4px}
.qa-pick button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;text-align:left;cursor:pointer}
.qa-pick button.on,.qa-pick button:hover{background:var(--surface)}
.qa-pick .pd{width:10px;height:10px;border-radius:50%;flex:none}
.qa-pick .ph{width:18px;text-align:center;color:var(--muted);font-weight:700;flex:none}
.qa-pick small{margin-left:auto;color:var(--muted);font-size:12.5px}
.qa-in textarea{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:19px;font-weight:600;padding:12px 0;resize:none;line-height:1.35;overflow:hidden;min-height:50px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:6px;margin:4px 0}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--soft)}
.chip svg{width:14px;height:14px}
.chip.k-date,.chip.k-time,.chip.k-remind{background:color-mix(in srgb,var(--meet) 14%,var(--bg));color:var(--ink)}
.chip.k-pri{background:color-mix(in srgb,var(--danger) 14%,var(--bg));color:var(--ink)}
.chip.k-proj{background:color-mix(in srgb,var(--accent) 24%,var(--bg));color:var(--ink)}
.chip.k-meet{background:var(--meet);color:#fff}
.preview{font-size:13px;color:var(--muted);margin:4px 0 10px}
.preview b{color:var(--ink)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45}
.tplrow{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.tplrow::-webkit-scrollbar{display:none}
.tplchip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;font-weight:600;background:var(--card)}
.btn{height:44px;padding:0 20px;border-radius:22px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.acc{background:var(--accent);color:var(--on-accent)}
.btn svg{width:18px;height:18px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--soft)}
.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:15px;outline:none;width:100%}
.inp:focus{border-color:var(--ink)}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.titlein{width:100%;border:0;outline:none;background:transparent;font-family:var(--fd);font-size:24px;font-weight:700;padding:8px 0}
.cl{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.cl input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex:none}
.cl .clt{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0;resize:none;padding:11px 0 9px;line-height:1.35;overflow:hidden;height:42px;font-family:inherit}
.cl.done .clt{text-decoration:line-through;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--danger) 10%,var(--bg));color:var(--danger);font-size:13.5px;font-weight:600;border-radius:12px;padding:10px 12px;margin:6px 0;line-height:1.4}
.daychips,.optchips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:40px;height:40px;border-radius:20px;background:var(--surface);font-weight:700;font-size:13px}
.daychips button.on,.optchips button.on{background:var(--ink);color:var(--bg)}
.optchips button{height:36px;padding:0 12px;border-radius:18px;background:var(--surface);font-weight:600;font-size:13.5px}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.switch.on{background:var(--ink)}
.switch.on::after{left:23px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.setrow .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.setrow .l b{font-size:15px}
.setrow .l span{font-size:12.5px;color:var(--muted);line-height:1.4}
.setsec{padding:6px 24px 10px}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.themes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.th{display:flex;flex-direction:column;text-align:left;border-radius:16px;padding:6px;border:2.5px solid transparent}
.th.on{border-color:var(--ink)}
.th .pv{display:flex;flex-direction:column;gap:8px;height:96px;padding:12px;border-radius:12px}
.th .nm{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px;font-size:14px;font-weight:700}
.th .nm svg{width:16px;height:16px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:18px;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--ink)}
.fonts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fontopt{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.fontopt.on{border-color:var(--ink)}
.fontopt b{font-size:22px}
.fontopt span{font-size:12.5px;color:var(--muted)}
.howto{font-size:13.5px;line-height:1.55;color:var(--soft);margin:6px 0 10px;padding-left:20px}
.howto li{margin:3px 0}
.notice{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.5;color:var(--soft);margin:8px 0}

/* habits */
.hsec{display:flex;align-items:baseline;justify-content:space-between;padding:20px 24px 6px}
.hsec h2{margin:0;font-size:19px;font-weight:700}
.hsec span{font-size:13px;color:var(--muted);font-weight:600}
.habit{display:flex;align-items:center;gap:12px;padding:10px 20px 10px 24px}
.hemo{width:52px;height:52px;border-radius:18px;background:var(--surface);flex:none;display:grid;place-items:center;font-size:26px;position:relative;border:2px solid transparent;transition:transform .15s}
.hemo:active{transform:scale(.94)}
.hemo.on{background:color-mix(in srgb,var(--accent) 30%,var(--bg));border-color:var(--accent)}
.hemo .tk{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:2px solid var(--bg)}
.hemo .tk svg{width:12px;height:12px}
.hemo.off{opacity:.45}
.hbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.hbody b{font-size:16px;font-weight:700}
.hbody .hm{font-size:12.5px;color:var(--muted)}
.mala{display:flex;align-items:center;margin-top:4px;position:relative;height:16px;width:max-content}
.mala::before{content:'';position:absolute;left:4px;right:4px;top:50%;height:1.5px;background:var(--line)}
.mala i{width:12px;height:12px;border-radius:6px;background:var(--bg);border:1.5px solid var(--ring);margin-right:6px;position:relative}
.mala i.on{background:var(--accent);border-color:var(--accent)}
.mala i.skip{border-style:dashed;border-color:var(--line)}
.mala i.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.hstreak{text-align:right;flex:none}
.hstreak b{display:block;font-family:var(--fd);font-size:22px;font-weight:800;line-height:1}
.hstreak small{font-size:11px;color:var(--muted);font-weight:600}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.hstat{background:var(--surface);border-radius:16px;padding:12px 14px}
.hstat span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.hstat b{font-family:var(--fd);font-size:28px;font-weight:800}
.hstat small{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px}
.mcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center}
.mcal .wd{font-size:11px;font-weight:700;color:var(--muted)}
.mcal button{aspect-ratio:1;border-radius:50%;font-size:12.5px;font-weight:600;border:1.5px solid var(--ring);display:grid;place-items:center;max-width:44px;width:100%;margin:0 auto}
.mcal button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mcal button.ns{border-style:dashed;border-color:var(--line);color:var(--muted)}
.mcal button.fut{border-color:transparent;color:var(--muted);opacity:.5}
.mcal button.td{box-shadow:0 0 0 2px var(--ink)}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:10px 0}
.monthnav b{font-family:var(--fd);font-size:18px}
.emojis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px}
.emojis button{height:40px;border-radius:10px;font-size:22px}
.emojis button.on{background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)}
.milestone{font-size:13.5px;color:var(--soft);background:color-mix(in srgb,var(--accent) 16%,var(--bg));border-radius:12px;padding:10px 12px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px 24px}
.calhead b{font-family:var(--fd);font-size:24px;font-weight:800}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;padding:0 14px}
.calgrid .wd{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
.cd{height:54px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:4px;font-size:15px;font-weight:600}
.cd.om{color:var(--muted);opacity:.5}
.cd.td span:first-child{background:var(--accent);color:var(--on-accent);border-radius:12px;padding:0 7px}
.cd.sel{background:var(--ink);color:var(--bg)}
.cd .dots{display:flex;gap:3px;height:6px}
.cd .dots i{width:5px;height:5px;border-radius:3px}

/* dates */
.dhero{margin:6px 20px 8px;border-radius:22px;padding:18px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:16px}
.dhero .big{font-family:var(--fd);font-size:64px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:var(--accent)}
.dhero .big small{display:block;font-size:13px;font-weight:600;letter-spacing:0;color:var(--bg);opacity:.75;margin-top:6px}
.dhero b{display:block;font-size:19px;font-family:var(--fd)}
.dhero span{font-size:13.5px;opacity:.8}
.dmonth{padding:18px 24px 4px;font-family:var(--fd);font-size:17px;font-weight:700;color:var(--soft)}
.drow{display:flex;align-items:center;gap:14px;padding:10px 24px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.drow .tok{width:58px;flex:none;text-align:center;line-height:1}
.drow .tok b{display:block;font-family:var(--fd);font-size:26px;font-weight:800}
.drow .tok small{font-size:11px;color:var(--muted);font-weight:600}
.drow .tok.now b{color:var(--accent-text)}
.drow .dn{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.drow .dn b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drow .dn span{font-size:12.5px;color:var(--muted)}
.drow .de{font-size:22px}
.filters{display:flex;gap:8px;padding:6px 24px;overflow-x:auto;scrollbar-width:none}

/* focus */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 24px}
.ringwrap{position:relative;width:250px;height:250px}
.ringwrap svg{width:250px;height:250px;transform:rotate(-90deg)}
.ringwrap .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .tt b{font-family:var(--fd);font-size:56px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ringwrap .tt span{font-size:14px;font-weight:600;color:var(--muted)}

/* ek kaam */
.ek{padding:10px 4px 6px}
.ek .why{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--accent-text);background:color-mix(in srgb,var(--accent) 16%,var(--bg));border-radius:10px;padding:4px 10px}
.ek h2{margin:12px 0 6px;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.ek .meta{font-size:14px;color:var(--muted)}
.ekacts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.ekacts .btn{width:100%}
.ekacts .wide{grid-column:1/-1}

/* insights */
.headline{margin:4px 24px 8px;font-family:var(--fd);font-size:27px;font-weight:700;line-height:1.2;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 24px 6px}
.stat{border-left:3px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column}
.stat b{font-family:var(--fd);font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.isec{margin:16px 8px 0;padding:18px 16px 4px;border-top:1px solid var(--line)}
.isec h2{margin:0 0 12px;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.isec h2 span{font-family:var(--fb);font-size:13px;font-weight:600;color:var(--muted)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:8px}
.trow{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-size:15px}
.trow:last-child{border-bottom:0}
.trow .n{flex:1;display:flex;flex-direction:column;font-weight:600;min-width:0}
.trow .n small{font-size:12px;color:var(--muted);font-weight:500}
.trow .v{font-weight:700}
.heat{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:5px;align-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.heat i{height:24px;border-radius:6px;display:block}
.tip{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin:12px 0}
.tip.a{background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.tip.m{background:color-mix(in srgb,var(--meet) 12%,var(--bg))}
.bars{display:grid;gap:6px;align-items:end;height:110px}
.bars div{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.bars i{width:min(12px,40%);border-radius:4px;display:block;min-height:3px}
.blabels{display:grid;gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 24px 0}
.tile{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile span{font-size:12.5px;font-weight:600;color:var(--muted)}
.tile b{font-family:var(--fd);font-size:24px;font-weight:800}
.tile em{font-style:normal;font-size:12px;font-weight:700}

/* misc */
.toast{position:fixed;left:50%;bottom:calc(152px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--accent);font-weight:800}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.menu button span{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.mlist .mrow{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--line)}
.mlist .mrow .tm{width:72px;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.mlist .mrow .tt{flex:1;min-width:0;font-weight:600}
.mlist .mrow.past{color:var(--muted)}
.dayh{padding:20px 24px 2px;display:flex;align-items:baseline;gap:10px}
.dayh b{font-family:var(--fd);font-size:19px}
.dayh span{font-size:13px;color:var(--muted)}
.mini{padding:0 24px;font-size:13px;color:var(--meet);font-weight:600}
.srch{display:flex;align-items:center;gap:8px;height:46px;border-radius:14px;background:var(--surface);padding:0 12px;margin:6px 0 10px}
.srch input,.srch textarea{flex:1;border:0;background:transparent;outline:none;font-size:16px;min-width:0;font-family:inherit;color:inherit;resize:none;overflow:hidden;white-space:nowrap;line-height:22px;height:24px;padding:0}
.sres{display:flex;flex-direction:column}
.sres .sr-h{font-size:12.5px;font-weight:700;color:var(--muted);padding:12px 0 2px}
.sres button{display:flex;align-items:center;gap:10px;min-height:48px;text-align:left;border-bottom:1px solid var(--line);font-size:15.5px;font-weight:600;width:100%}
.sres button small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.imp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.imp button{border:1.5px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.imp button b{font-size:16px}
.imp button span{font-size:12.5px;color:var(--muted);line-height:1.35}
.imp button.on{border-color:var(--ink)}
.syncdot{display:inline-block;width:8px;height:8px;border-radius:4px;background:#2E9E5B;margin-right:6px}

/* v2.1 */
.obj{display:flex;flex-direction:column;gap:3px;margin:0 24px 12px;text-align:left;width:calc(100% - 48px)}
.obj-k{font-size:12.5px;font-weight:700;color:var(--muted)}
.obj-v{font-family:var(--fd);font-size:21px;font-weight:700;line-height:1.35;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:6px}
.ichips{display:flex;gap:8px;padding:0 20px 10px;overflow-x:auto;scrollbar-width:none}
.ichips::-webkit-scrollbar{display:none}
.ichip{flex:none;height:38px;padding:0 14px;border-radius:19px;border:1.5px dashed var(--ring);font-size:13.5px;font-weight:600;color:var(--soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ichip svg{width:16px;height:16px}
.ichip.set{border-style:solid;border-color:var(--line);background:var(--surface);color:var(--ink);max-width:280px;overflow:hidden;text-overflow:ellipsis}
.ichip.ek{border:0;background:var(--accent);color:var(--on-accent);font-weight:700}
.impact{margin:16px 20px 0;border-radius:20px;background:color-mix(in srgb,var(--accent) 13%,var(--bg));padding:12px 0 4px}
.impact .list{padding:0 8px}
.impact .row{background:transparent}
.impact-h{display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-size:13px;font-weight:800;color:var(--accent-text)}
.impact-h span{display:inline-flex;gap:6px;align-items:center}
.impact-h svg{width:16px;height:16px}
.impact-h button{font-size:12.5px;font-weight:700;color:var(--muted);height:32px}
.impact-done{padding:0 16px 10px 58px;font-size:13px;color:var(--soft);font-weight:600}
.gnote{margin:8px 20px 0;display:flex;align-items:center;gap:8px;width:calc(100% - 40px);padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--meet) 12%,var(--bg));font-size:13.5px;font-weight:600;text-align:left}
.gnote svg{width:16px;height:16px;color:var(--meet)}
/* habits v2.1 */
.habit{display:grid;grid-template-columns:52px 1fr auto;column-gap:12px;row-gap:10px;align-items:center;padding:14px 20px 14px 24px;border-bottom:1px solid var(--line)}
.hdays{grid-column:2/4;display:flex;gap:4px}
.hd{display:flex;flex-direction:column;align-items:center;gap:3px;width:36px}
.hd small{font-size:10.5px;font-weight:700;color:var(--muted)}
.hd i{width:30px;height:30px;border-radius:15px;border:1.5px solid var(--ring);display:grid;place-items:center;font-style:normal}
.hd i svg{width:15px;height:15px}
.hd.ok i{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hd.no i{background:color-mix(in srgb,var(--danger) 13%,var(--bg));border-color:color-mix(in srgb,var(--danger) 50%,var(--bg));color:var(--danger)}
.hd.rest i{border-style:dashed;border-color:var(--line)}
.hd.td small{color:var(--ink)}
.hd.td i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}
.mcal button.miss{background:color-mix(in srgb,var(--danger) 13%,var(--bg));border-color:color-mix(in srgb,var(--danger) 50%,var(--bg));color:var(--danger)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;font-weight:600;color:var(--muted);margin-top:10px}
.legend2 i{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:8px;border:1.5px solid var(--ring);margin-right:5px;vertical-align:-3px;font-style:normal}
.legend2 i svg{width:10px;height:10px}
/* task page */
.page{position:fixed;inset:0;background:var(--bg);z-index:44;overflow-y:auto;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.8,.2,1);visibility:hidden;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.page.on{transform:none;visibility:visible}
@media (min-width:900px){.page{left:auto;width:540px;border-left:1px solid var(--line);box-shadow:-24px 0 48px rgba(0,0,0,.08)}}
.pbar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 8px 4px}
.pbar .acts{display:flex}
.ptitle{display:flex;gap:4px;align-items:flex-start;padding:2px 18px 0 12px}
.ptitle .chk{height:52px}
.ptitle textarea{flex:1;border:0;outline:none;resize:none;background:transparent;font-family:var(--fd);font-size:26px;font-weight:700;line-height:1.25;padding:8px 0 4px;min-height:44px;overflow:hidden}
.ptitle.done textarea{text-decoration:line-through;color:var(--muted)}
.props{display:flex;flex-wrap:wrap;gap:8px;padding:8px 20px 4px}
.prop{height:34px;padding:0 12px;border-radius:10px;background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--soft);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prop svg{width:15px;height:15px;flex:none}
.prop.more{background:transparent;border:1.5px dashed var(--ring);color:var(--muted)}
.prop.late{background:color-mix(in srgb,var(--danger) 12%,var(--bg));color:var(--danger)}
.prop.p1{color:var(--danger)} .prop.p2{color:var(--accent-text)} .prop.p3{color:var(--meet)}
.psec{padding:16px 20px 0}
.psec h3{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--muted);display:flex;justify-content:space-between}
.ntool{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:4px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ntool::-webkit-scrollbar{display:none}
.ntool button{flex:none;min-width:38px;height:36px;border-radius:9px;font-size:15px;color:var(--soft)}
.ntool button:active{background:var(--surface)}
.notes{min-height:140px;outline:none;font-size:16px;line-height:1.65;padding:12px 2px;word-break:break-word}
.notes:empty::before{content:attr(data-ph);color:var(--muted)}
.notes mark{background:#FFE58A;color:#1a1400;padding:0 3px;border-radius:3px}
.notes h3{font-family:var(--fd);font-size:19px;margin:8px 0 2px}
.notes ul,.notes ol{margin:4px 0;padding-left:22px}
.notes a{color:var(--meet)}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.imgs .im{aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--surface);padding:0}
.imgs img{width:100%;height:100%;object-fit:cover;display:block}
.imgs .addimg{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--ring);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12.5px;font-weight:600}
.pfoot{padding:22px 20px 8px;font-size:12.5px;color:var(--muted);line-height:1.5}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:70;display:none;align-items:center;justify-content:center}
.viewer.on{display:flex}
.viewer img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.viewer .vbar button{color:#fff;height:44px;padding:0 14px;font-weight:700;border-radius:22px;background:rgba(255,255,255,.12)}
.clw{flex:1;min-width:0;display:flex;flex-direction:column}
.ntool{position:relative}
.npop{position:fixed;z-index:60;min-width:180px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.2);padding:4px;display:flex;flex-direction:column}
.npop[hidden]{display:none}
.npop button{display:block;width:100%;text-align:left;padding:9px 12px!important;border-radius:8px;height:auto!important;white-space:nowrap}
.npop button:hover{background:var(--surface)}
.fs-s{font-size:.82em}.fs-l{font-size:1.22em}.fs-xl{font-size:1.5em;font-weight:700;line-height:1.25}

/* Reads the AI's JSON even if it was wrapped in prose or cut off part-way: keeps every complete item and closes the rest. */
function jsonLoose(txt) {
  const i = txt.indexOf('{'); if (i < 0) return null; const src = txt.slice(i);
  try { return JSON.parse(src.slice(0, src.lastIndexOf('}') + 1)); } catch (e) { }
  const st = []; let inS = false, esc2 = false, cut = 0, cutStack = [];
  for (let k = 0; k < src.length; k++) {
    const ch = src[k];
    if (inS) { if (esc2) esc2 = false; else if (ch === '\\') esc2 = true; else if (ch === '"') inS = false; continue; }
    if (ch === '"') inS = true; else if (ch === '{' || ch === '[') st.push(ch);
    else if (ch === '}' || ch === ']') { st.pop(); cut = k + 1; cutStack = st.slice(); if (!st.length) break; }

  }
  const close = cutStack.slice().reverse().map(c => c === '{' ? '}' : ']').join('');
  try { return JSON.parse(src.slice(0, cut) + close); } catch (e) { return null; }
}
