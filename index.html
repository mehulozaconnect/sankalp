<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sankalp</title>
<meta name="description" content="Sankalp: tasks, habits, focus and insights in one calm app.">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sankalp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F2F3F7;--line:#E6E8EF;--ink:#121826;--muted:#5B6170;--soft:#3D4352;
  --accent:#F2A33A;--accent-text:#B45309;--on-accent:#121826;--meet:#5B5BD6;--ring:#C5C9D3;
  --danger:#B93815;--card:#FFFFFF;--shadow:rgba(18,24,38,.22);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px;border-radius:8px}
.display{font-family:'Bricolage Grotesque',sans-serif}
.dev{font-family:'Noto Sans Devanagari',sans-serif}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

#app{display:flex;min-height:100vh}
.side{display:none}
main{flex:1;min-width:0;max-width:780px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 6px) 0 140px}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;width:270px;flex:none;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 12px 40px}
  main{padding-top:20px}
  .only-mobile{display:none!important}
}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 0 6px;min-height:52px}
.iconbtn{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.iconbtn:hover{background:var(--surface)}
.back{height:44px;display:inline-flex;align-items:center;gap:2px;padding:0 8px;font-weight:600;font-size:16px;text-decoration:none}
a.navi,a.btn,a.pill,a.iconbtn{text-decoration:none}
#tWhen button{min-width:0;font-size:13px;white-space:nowrap;padding:0 4px}
.wordmark{font-family:'Noto Sans Devanagari',sans-serif;font-weight:800;line-height:1}
.pad{padding:0 24px}
h1.title{margin:4px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
h2.sec{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700}
.sechead{display:flex;justify-content:space-between;align-items:baseline;padding:22px 24px 4px}
.sechead .muted{font-size:13px;font-weight:600}

/* date hero */
.datehero{display:flex;align-items:center;gap:14px;padding:0 24px 14px}
.datehero .num{font-family:'Bricolage Grotesque',sans-serif;font-size:84px;font-weight:800;line-height:.9;letter-spacing:-.05em}
.datehero h1{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:700;line-height:1.1}
.datehero .sub{font-size:14px;color:var(--muted)}

/* day band */
.band{background:var(--surface);padding:14px 20px 16px;display:flex;flex-direction:column;gap:8px}
@media (min-width:900px){.band{margin:0 24px;border-radius:18px}}
.band .bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.band .bh b{font-size:15px}
.band .bh span{font-size:13px;color:var(--muted)}
.bar{position:relative;height:74px;margin-top:2px}
.bar .track{position:absolute;left:0;right:0;top:24px;height:34px;border-radius:10px;background:var(--card);overflow:hidden}
.bar .past{position:absolute;left:0;top:0;bottom:0;background:var(--line)}
.bar .blk{position:absolute;top:5px;bottom:5px;border-radius:5px;min-width:5px}
.bar .blk.meet{background:var(--meet)}
.bar .blk.focus{background:var(--accent)}
.bar .tick{position:absolute;bottom:3px;width:6px;height:6px;border-radius:3px;background:var(--ink);transform:translateX(-50%)}
.bar .now{position:absolute;top:20px;height:42px;width:2px;margin-left:-1px;background:var(--ink)}
.bar .nowlbl{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;white-space:nowrap}
.bar .scale{position:absolute;left:0;right:0;bottom:0;height:12px;font-size:10.5px;font-weight:600;color:var(--muted)}
.bar .scale span{position:absolute;transform:translateX(-50%)}
.bar .scale span:first-child{transform:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;font-weight:600;color:var(--soft)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.nextcard{background:var(--card);border-radius:14px;padding:10px 10px 10px 12px;display:flex;align-items:center;gap:12px;margin-top:4px}
.nextcard .stripe{width:4px;align-self:stretch;border-radius:2px;background:var(--meet)}
.nextcard .t{font-size:15px;font-weight:700}
.nextcard .s{font-size:12.5px;color:var(--muted)}
.pill{height:36px;padding:0 16px;border-radius:18px;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.pill.meet{background:var(--meet);color:#fff}
.pill.ink{background:var(--ink);color:var(--bg)}
.pill.ghost{border:1px solid var(--line);background:var(--card)}
.pill.acc{background:var(--accent);color:var(--on-accent)}

/* task rows */
.list{padding:0 20px}
.row{display:flex;align-items:flex-start;gap:4px;position:relative;background:var(--bg);touch-action:pan-y;transition:transform .18s ease}
.row.dragging{transition:none}
.chk{width:40px;height:46px;flex:none;display:grid;place-items:center}
.chk::before{content:'';grid-area:1/1;width:22px;height:22px;border-radius:11px;border:2px solid var(--ring);box-sizing:border-box;display:block}
.chk svg{grid-area:1/1}
.chk.p1::before{border-color:var(--danger)}
.chk.p2::before{border-color:var(--accent-text)}
.chk.p3::before{border-color:var(--meet)}
.chk svg{width:13px;height:13px;position:relative}
.row.done .chk::before{background:var(--accent);border-color:var(--accent)}
.row.done .chk svg{color:var(--on-accent)}
.rbody{flex:1;min-width:0;text-align:left;display:flex;flex-direction:column;gap:3px;padding:12px 0 10px}
.rt{font-size:17px;font-weight:600;line-height:1.3;word-break:break-word}
.row.done .rt{color:var(--muted);text-decoration:line-through;font-weight:500}
.rm{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12.5px;color:var(--muted)}
.rm .mi{display:inline-flex;align-items:center;gap:3px}
.rm .mi svg{width:12px;height:12px}
.rm .late{color:var(--danger);font-weight:700}
.rm .proj{font-weight:600;color:var(--soft)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;flex:none}
.swipehint{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:13px;pointer-events:none;opacity:0}
.empty{padding:28px 24px;color:var(--muted);font-size:15px;line-height:1.5}
.empty b{color:var(--ink)}

/* home */
.hello{padding:14px 24px 0;display:flex;flex-direction:column;gap:14px}
.hello p{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:30px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.search{margin:20px 24px 8px;display:flex;align-items:center;gap:8px;height:44px;border-radius:12px;background:var(--surface);padding:0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;outline:none;font-size:15px;color:var(--ink);min-width:0}
.nav{display:flex;flex-direction:column;padding:0 14px}
.navi{display:flex;align-items:center;gap:14px;min-height:48px;padding:0 10px;border-radius:12px;text-decoration:none;font-size:17px;font-weight:600;width:100%;text-align:left}
.navi:hover{background:var(--surface)}
.navi svg{width:20px;height:20px;flex:none}
.navi .c{font-size:15px;font-weight:500;color:var(--muted)}
.navi .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navi.on{background:var(--ink);color:var(--bg)}
.navi.on .c{color:var(--accent)}
.navi .bad{min-width:20px;height:20px;border-radius:10px;background:var(--danger);color:#fff;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.area{margin:18px 10px 4px 24px;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700}
.side .area{margin-left:10px;font-size:16px}
.side .navi{font-size:15px;min-height:40px}
.prog{width:44px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.prog i{display:block;height:5px;background:var(--ink)}

/* FAB */
.fab{position:fixed;right:max(22px,env(safe-area-inset-right));bottom:calc(30px + env(safe-area-inset-bottom));height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;box-shadow:0 10px 24px var(--shadow);z-index:20}
.fab svg{color:var(--accent)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,18,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:50;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding:10px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.on{transform:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:600px;margin-left:-300px;bottom:auto;top:8vh;border-radius:22px;transform:translateY(20px);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}.sheet.on{transform:none;opacity:1;pointer-events:auto}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.qa-in{display:flex;gap:8px;align-items:center}
.qa-in input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:20px;font-weight:600;padding:10px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:10px;margin:6px 0 4px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;background:var(--surface);font-size:13.5px;font-weight:600;color:var(--soft)}
.chip svg{width:14px;height:14px}
.chip.k-date,.chip.k-time,.chip.k-remind{background:color-mix(in srgb,var(--meet) 14%,var(--bg));color:var(--ink)}
.chip.k-pri{background:color-mix(in srgb,var(--danger) 14%,var(--bg));color:var(--ink)}
.chip.k-proj{background:color-mix(in srgb,var(--accent) 22%,var(--bg));color:var(--ink)}
.preview{font-size:13px;color:var(--muted);margin:2px 0 10px}
.preview b{color:var(--ink)}
.qa-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.4}
.btn{height:44px;padding:0 20px;border-radius:22px;background:var(--ink);color:var(--bg);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sec{background:var(--surface);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.small{height:36px;font-size:13.5px;padding:0 14px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field>label,.flabel{font-size:13px;font-weight:700;color:var(--soft)}
.inp{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 12px;font-size:15px;outline:none;width:100%}
.inp:focus{border-color:var(--ink)}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;line-height:1.45;resize:vertical}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.titlein{width:100%;border:0;outline:none;background:transparent;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;padding:6px 0}
.cl{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line)}
.cl input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.cl .clt{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.cl.done .clt{text-decoration:line-through;color:var(--muted)}
.warn{background:color-mix(in srgb,var(--danger) 10%,var(--bg));color:var(--danger);font-size:13px;font-weight:700;border-radius:10px;padding:8px 12px}
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.daychips button{width:40px;height:40px;border-radius:20px;background:var(--surface);font-weight:700;font-size:13px}
.daychips button.on{background:var(--ink);color:var(--bg)}
.switch{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s}
.switch.on{background:var(--ink)}
.switch.on::after{left:23px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;border-bottom:1px solid var(--line)}
.setrow .l{display:flex;flex-direction:column;gap:2px;min-width:0}
.setrow .l b{font-size:15px}
.setrow .l span{font-size:12.5px;color:var(--muted)}
.setsec{padding:6px 24px 10px}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.themes{grid-template-columns:repeat(3,minmax(0,1fr))}}
.th{display:flex;flex-direction:column;text-align:left;border-radius:16px;padding:6px;border:2.5px solid transparent}
.th.on{border-color:var(--ink)}
.th .pv{display:flex;flex-direction:column;gap:8px;height:100px;padding:12px;border-radius:12px}
.th .nm{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 2px;font-size:14px;font-weight:700}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line)}
.hcheck{width:44px;height:44px;border-radius:22px;border:2.5px solid var(--ring);flex:none;display:flex;align-items:center;justify-content:center}
.hcheck.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hbody{flex:1;min-width:0;text-align:left}
.hbody b{display:block;font-size:16px}
.hbody span{font-size:12.5px;color:var(--muted)}
.hdots{display:flex;gap:3px;margin-top:6px}
.hdots i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.hdots i.on{background:var(--accent)}
.hdots i.off{background:transparent;border:1px dashed var(--line)}
.streak{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:800;text-align:right;line-height:1}
.streak small{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:600;color:var(--muted)}

/* focus */
.timer{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 24px}
.ringwrap{position:relative;width:260px;height:260px}
.ringwrap svg{width:260px;height:260px;transform:rotate(-90deg)}
.ringwrap .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringwrap .tt b{font-family:'Bricolage Grotesque',sans-serif;font-size:58px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ringwrap .tt span{font-size:14px;font-weight:600;color:var(--muted)}
.tbtns{display:flex;gap:10px}

/* insights */
.headline{margin:4px 24px 8px;font-family:'Bricolage Grotesque',sans-serif;font-size:28px;font-weight:700;line-height:1.18;letter-spacing:-.02em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 24px 6px}
.stat{border-left:3px solid var(--accent);padding:2px 0 2px 10px;display:flex;flex-direction:column}
.stat b{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800}
.stat span{font-size:12px;color:var(--muted)}
.isec{margin:16px 8px 0;padding:18px 16px 4px;border-top:1px solid var(--line)}
.isec h2{margin:0 0 12px;font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.isec h2 span{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:600;color:var(--muted)}
.stack{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:8px}
.trow{display:flex;align-items:center;gap:10px;min-height:44px;border-bottom:1px solid var(--line);font-size:15px}
.trow:last-child{border-bottom:0}
.trow .n{flex:1;display:flex;flex-direction:column;font-weight:600}
.trow .n small{font-size:12px;color:var(--muted);font-weight:500}
.trow .v{font-weight:700}
.heat{display:grid;grid-template-columns:34px repeat(6,minmax(0,1fr));gap:5px;align-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.heat i{height:26px;border-radius:6px;display:block}
.tip{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin:12px 0}
.tip.a{background:color-mix(in srgb,var(--accent) 16%,var(--bg))}
.tip.m{background:color-mix(in srgb,var(--meet) 12%,var(--bg))}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:110px}
.bars div{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:100%}
.bars i{width:12px;border-radius:4px;display:block;min-height:3px}
.blabels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 24px 0}
.tile{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.tile span{font-size:12.5px;font-weight:600;color:var(--muted)}
.tile b{font-family:'Bricolage Grotesque',sans-serif;font-size:24px;font-weight:800}
.tile em{font-style:normal;font-size:12px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px 12px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{color:var(--accent);font-weight:800}
.menu{display:flex;flex-direction:column}
.menu button{display:flex;align-items:center;gap:12px;min-height:52px;font-size:16px;font-weight:600;border-bottom:1px solid var(--line);text-align:left}
.menu button span{margin-left:auto;font-size:13px;color:var(--muted);font-weight:500}
.mlist .mrow{display:flex;align-items:center;gap:12px;min-height:54px;border-bottom:1px solid var(--line)}
.mlist .mrow .tm{width:70px;font-size:13px;font-weight:600;color:var(--muted);flex:none}
.mlist .mrow .tt{flex:1;min-width:0;font-weight:600}
.mlist .mrow.past{color:var(--muted)}
.dayh{padding:20px 24px 2px;display:flex;align-items:baseline;gap:10px}

<script>
'use strict';
/* ---------- utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = pYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const minOf = ms => { const d = new Date(ms); return d.getHours() * 60 + d.getMinutes(); };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYSL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONSL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function fmtTime(hm) { if (!hm) return ''; let [h, m] = hm.split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${pad(m)} ${ap}`; }
function fmtClock(ms) { const d = new Date(ms); return fmtTime(pad(d.getHours()) + ':' + pad(d.getMinutes())); }
function fmtDate(s) {
  if (!s) return '';
  const t = today(), diff = Math.round((pYmd(s) - pYmd(t)) / 864e5);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  const d = pYmd(s);
  if (diff > 1 && diff < 7) return DAYSL[d.getDay()];
  return `${d.getDate()} ${MONS[d.getMonth()]}` + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : '');
}
function fmtMins(m) { m = Math.round(m); if (m < 60) return m + 'm'; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h ${r}m` : `${h}h`; }

/* ---------- icons ---------- */

const I = {

  sun: sv('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', 2.2),

  search: sv('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>', 2.2),
  bell: sv('<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>', 2.2),
  repeat: sv('<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>', 2.2),

  mic: sv('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/>', 2),

  folder: sv('<path d="M3 7h6l2 2h10v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>', 2),

  box: sv('<rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/>', 2),
  hour: sv('<path d="M6 2h12M6 22h12M7 2c0 5 10 5 10 10S7 17 7 22M17 2c0 5-10 5-10 10s10 5 10 10"/>', 1.8),
  plus: sv('<path d="M12 5v14M5 12h14"/>', 2.4),
  trash: sv('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', 2),
  play: sv('<path d="M7 4l13 8-13 8z"/>', 2.2),
  pause: sv('<path d="M8 4v16M16 4v16"/>', 2.6),
  edit: sv('<path d="M4 20h4L19 9l-4-4L4 16z"/>', 2)
};

/* ---------- themes ---------- */
const THEMES = {
  Marigold: { bg: '#FFFFFF', surface: '#F2F3F7', line: '#E6E8EF', ink: '#121826', muted: '#5B6170', soft: '#3D4352', accent: '#F2A33A', accentText: '#B45309', onAccent: '#121826', meet: '#5B5BD6', ring: '#C5C9D3', danger: '#B93815' },
  Monsoon: { bg: '#F7FBFB', surface: '#E6F1F1', line: '#D3E4E4', ink: '#0B2E33', muted: '#48686D', soft: '#2F4F54', accent: '#0F9D8A', accentText: '#0B7A6B', onAccent: '#FFFFFF', meet: '#2563EB', ring: '#9DBDBD', danger: '#B93815' },
  Gulmohar: { bg: '#FFFAF8', surface: '#FCEBE6', line: '#F3D4CB', ink: '#3B0D0C', muted: '#77463F', soft: '#5A2A24', accent: '#E0482A', accentText: '#B8341A', onAccent: '#FFFFFF', meet: '#7C3AED', ring: '#D9A99C', danger: '#B4231A' },
  Neem: { bg: '#F8FAF5', surface: '#EAF1E2', line: '#D7E3CB', ink: '#1C2B12', muted: '#4F6046', soft: '#34452B', accent: '#4D9A2A', accentText: '#3B7A1E', onAccent: '#FFFFFF', meet: '#B45309', ring: '#A8BC97', danger: '#B93815' },
  Jamun: { bg: '#FAF8FE', surface: '#EFEAFA', line: '#DED6F2', ink: '#22163F', muted: '#5B5180', soft: '#3E3463', accent: '#8B5CF6', accentText: '#6D3FE0', onAccent: '#FFFFFF', meet: '#DB2777', ring: '#B5A8D9', danger: '#B93815' },
  Midnight: { bg: '#0F1117', surface: '#1A1D26', line: '#2A2E3B', ink: '#F4F5F8', muted: '#A3A8B6', soft: '#C9CDD8', accent: '#F2A33A', accentText: '#F2A33A', onAccent: '#121826', meet: '#8585F2', ring: '#4A4F60', danger: '#F07B5A', dark: true }
};
function darkOf(t) { return { ...THEMES.Midnight, accent: t.accent, accentText: t.accent, onAccent: t.onAccent, meet: t === THEMES.Midnight ? THEMES.Midnight.meet : lighten(t.meet) }; }
function lighten(hex) { const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255; r = Math.round(r + (255 - r) * .3); g = Math.round(g + (255 - g) * .3); b = Math.round(b + (255 - b) * .3); return '#' + [r, g, b].map(x => pad(x.toString(16))).join(''); }
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const base = THEMES[S.settings.theme] || THEMES.Marigold;
  const mode = S.settings.mode;
  const dark = base.dark || mode === 'dark' || (mode === 'auto' && mq.matches);
  const t = dark && !base.dark ? darkOf(base) : base;
  const r = document.documentElement.style;
  r.setProperty('--bg', t.bg); r.setProperty('--surface', t.surface); r.setProperty('--line', t.line); r.setProperty('--ink', t.ink);
  r.setProperty('--muted', t.muted); r.setProperty('--soft', t.soft); r.setProperty('--accent', t.accent); r.setProperty('--accent-text', t.accentText);
  r.setProperty('--on-accent', t.onAccent); r.setProperty('--meet', t.meet); r.setProperty('--ring', t.ring); r.setProperty('--danger', t.danger);
  r.setProperty('--card', dark ? '#262A37' : '#FFFFFF'); r.setProperty('--shadow', dark ? 'rgba(0,0,0,.5)' : 'rgba(18,24,38,.22)');
  document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
  $('meta[name=theme-color]').setAttribute('content', t.bg);
}
mq.addEventListener?.('change', () => { applyTheme(); });

/* ---------- state ---------- */
const KEY = 'sankalp.v1';
let S = load();
function seed() {
  const P = (name, area, color) => ({ id: uid(), name, area, color });
  const projects = [P('Sales', 'Work', '#F2A33A'), P('Client demos', 'Work', '#14B8A6'), P('Home', 'Personal', '#C2367A'), P('Health', 'Personal', '#4D9A2A')];
  const s = {
    v: 1, tasks: [], projects, habits: [], focus: [], plan: {}, meetLog: {}, fired: {},
    timer: { mode: 'work', running: false, endAt: 0, left: 25 * 60, taskId: '' },
    settings: { theme: 'Marigold', mode: 'auto', pomo: 25, brk: 5, morning: '08:30', meetBefore: 10, msClientId: '', lastSummary: '', msSyncedAt: 0 }
  };
  s.tasks.push(newTask({ title: 'Tap Add and type: Call mom kal 5pm p2, home' }));
  s.tasks.push(newTask({ title: 'Tick this circle to finish a task. Swipe left on a task to reschedule it.' }));
  return s;
}
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.v === 1) { return migrate(s); } } catch (e) { }
  return seed();
}
function migrate(s) {
  s.fired ||= {}; s.meetLog ||= {}; s.plan ||= {}; s.focus ||= []; s.habits ||= [];
  s.timer ||= { mode: 'work', running: false, endAt: 0, left: 25 * 60, taskId: '' };
  s.settings = Object.assign({ theme: 'Marigold', mode: 'auto', pomo: 25, brk: 5, morning: '08:30', meetBefore: 10, msClientId: '', lastSummary: '', msSyncedAt: 0 }, s.settings || {});
  return s;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save. Phone storage may be full.'); } }
function newTask(p) { return Object.assign({ id: uid(), title: '', notes: '', projectId: null, date: null, time: null, evening: false, someday: false, priority: 4, tags: [], repeat: null, remind: null, duration: null, checklist: [], done: false, doneAt: null, createdAt: Date.now(), pushed: 0, fired: '', snoozeUntil: 0 }, p); }
const getTask = id => S.tasks.find(t => t.id === id);
const proj = id => S.projects.find(p => p.id === id);
function findProject(name) { const n = name.trim().toLowerCase(); return S.projects.find(p => p.name.toLowerCase() === n); }
function addPlan(t) { if (!t.date || t.done) return; (S.plan[t.date] ||= []); if (!S.plan[t.date].includes(t.id)) S.plan[t.date].push(t.id); }
function setDate(t, date) {
  const old = t.date, td = today();
  if (old && date && date > old && old <= td) t.pushed = (t.pushed || 0) + 1;
  t.date = date; t.fired = '';
  if (date) t.someday = false;
  addPlan(t);
}
function areas() { const a = []; S.projects.forEach(p => { if (!a.includes(p.area)) a.push(p.area); }); return a; }

/* ---------- repeat ---------- */
function repeatLabel(r) {
  if (!r) return '';
  if (r.type === 'daily') return r.n > 1 ? `Every ${r.n} days` : 'Daily';
  if (r.type === 'weekly') return r.n > 1 ? `Every ${r.n} weeks` : 'Weekly';
  if (r.type === 'monthly') return r.n > 1 ? `Every ${r.n} months` : 'Monthly';
  if (r.type === 'weekdays') return 'Weekdays';
  if (r.type === 'days') return 'Every ' + r.days.map(d => DAYS[d]).join(', ');
  return '';
}
function nextDate(t) {
  const r = t.repeat; const base = t.date < today() ? today() : t.date; const d = pYmd(base);
  if (r.type === 'daily') d.setDate(d.getDate() + (r.n || 1));
  else if (r.type === 'weekly') d.setDate(d.getDate() + 7 * (r.n || 1));
  else if (r.type === 'monthly') d.setMonth(d.getMonth() + (r.n || 1));
  else if (r.type === 'weekdays') { do d.setDate(d.getDate() + 1); while (d.getDay() === 0 || d.getDay() === 6); }
  else if (r.type === 'days') { let i = 0; do { d.setDate(d.getDate() + 1); i++; } while (!r.days.includes(d.getDay()) && i < 8); }
  return ymd(d);
}
function firstDate(r) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (r.type === 'weekdays') { while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1); }
  if (r.type === 'days') { let i = 0; while (!r.days.includes(d.getDay()) && i < 8) { d.setDate(d.getDate() + 1); i++; } }
  return ymd(d);
}

/* ---------- natural language parser ---------- */
const WDRE = '(?:mon(?:day)?|tue(?:s|sday)?|wed(?:nesday)?|thu(?:r|rs|rsday)?|fri(?:day)?|sat(?:urday)?|sun(?:day)?)';
const MONRE = '(?:jan(?:uary)?|feb(?:ruary)?|mar(?:ch)?|apr(?:il)?|may|june?|july?|aug(?:ust)?|sep(?:t|tember)?|oct(?:ober)?|nov(?:ember)?|dec(?:ember)?)';
const wdIndex = w => ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(w.slice(0, 3).toLowerCase());
const monIndex = w => ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'].indexOf(w.slice(0, 3).toLowerCase());
function nextWeekday(i, allowToday) { const d = new Date(); d.setHours(0, 0, 0, 0); let k = 0; while (true) { if (d.getDay() === i && (allowToday || k > 0)) break; d.setDate(d.getDate() + 1); k++; } return ymd(d); }
function parseTask(input) {
  const r = { title: '', date: null, time: null, evening: false, someday: false, priority: null, projectId: null, newProject: null, tags: [], repeat: null, remind: null, duration: null };
  const M = '\u0001';
  let s = ' ' + input.replace(/\s+/g, ' ') + ' ';
  const B = '(^|[\\s,\\u0001])', E = '(?=[\\s,.!?\\u0001]|$)';
  const take = (src, fn) => {
    const m = s.match(new RegExp(B + src + E, 'i'));
    if (!m) return false;
    if (fn(m) === false) return false;
    s = s.slice(0, m.index) + m[1] + M + s.slice(m.index + m[0].length);
    return true;
  };
  const setPart = w => {
    w = w.toLowerCase();
    if (/morning|subah/.test(w)) r.time = '09:00';
    else if (/afternoon|dopahar/.test(w)) r.time = '14:00';
    else if (/evening|shaam|sham/.test(w)) { r.time = '19:00'; r.evening = true; }
    else if (/night|raat/.test(w)) { r.time = '21:00'; r.evening = true; }
  };
  // reminder
  take('remind(?:\\s+me)?\\s+(\\d+)\\s*(m|min|mins|minutes|h|hr|hrs|hour|hours)(?:\\s+before)?', m => { r.remind = +m[2] * (/^h/i.test(m[3]) ? 60 : 1); });
  // repeat
  // a repeat word that starts the task ("Weekly review") stays in the title but still sets the repeat
  const lead = (m, rep) => { r.repeat = rep; return m.index === 0 ? false : undefined; };
  take('(?:every\\s+day|har\\s+din)', () => { r.repeat = { type: 'daily', n: 1 }; }) ||
    take('(?:every\\s+weekday|on\\s+weekdays)', () => { r.repeat = { type: 'weekdays' }; }) ||
    take('every\\s+(\\d+)\\s*(days?|weeks?|months?)', m => { const u = m[3][0].toLowerCase(); r.repeat = { type: u === 'd' ? 'daily' : u === 'w' ? 'weekly' : 'monthly', n: +m[2] }; }) ||
    take('every\\s+(' + WDRE + '(?:\\s*(?:,|and|&)\\s*' + WDRE + ')*)', m => { const days = [...m[2].matchAll(new RegExp(WDRE, 'gi'))].map(x => wdIndex(x[0])); r.repeat = { type: 'days', days: [...new Set(days)].sort() }; }) ||
    take('every\\s+week', () => { r.repeat = { type: 'weekly', n: 1 }; }) ||
    take('every\\s+month', () => { r.repeat = { type: 'monthly', n: 1 }; }) ||
    take('(?:everyday|daily|roz)', m => lead(m, { type: 'daily', n: 1 })) ||
    take('weekdays', m => lead(m, { type: 'weekdays' })) ||
    take('weekly', m => lead(m, { type: 'weekly', n: 1 })) ||
    take('monthly', m => lead(m, { type: 'monthly', n: 1 }));
  // priority
  take('(?:p|!)([1-4])', m => { r.priority = +m[2]; });
  // tags
  let guard = 0; while (guard++ < 10 && take('@([\\w-]+)', m => { r.tags.push(m[2].toLowerCase()); }));
  // #project
  take('#([\\w-]+)', m => { const name = m[2].replace(/[-_]/g, ' '); const p = findProject(name); if (p) r.projectId = p.id; else r.newProject = cap(name); });
  // date + part of day
  take('(today|aaj|tomorrow|tmrw|tmr|kal|this)\\s+(morning|afternoon|evening|night|subah|dopahar|shaam|sham|raat)', m => {
    r.date = /^(tomorrow|tmrw|tmr|kal)$/i.test(m[2]) ? addDays(today(), 1) : today(); setPart(m[3]);
  });
  take('tonight', () => { r.date ||= today(); setPart('night'); });
  take('in\\s+the\\s+(morning|afternoon|evening)', m => setPart(m[2]));
  take('(subah|dopahar|shaam|sham|raat)', m => setPart(m[2]));
  // explicit time
  take('(?:at\\s+)?(\\d{1,2})(?:[:.](\\d{2}))?\\s*(am|pm)', m => {
    let h = +m[2]; const mi = +(m[3] || 0); if (h > 12 || h < 1 || mi > 59) return false;
    const pm = m[4].toLowerCase() === 'pm'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12;
    r.time = pad(h) + ':' + pad(mi);
  }) ||
    take('(?:at\\s+)?([01]?\\d|2[0-3])[:.]([0-5]\\d)', m => { let h = +m[2]; if (h >= 1 && h <= 7) h += 12; r.time = pad(h) + ':' + m[3]; }) ||
    take('(\\d{1,2})\\s*baje', m => { let h = +m[2]; if (h > 12 || h < 1) return false; if (h <= 7 || (r.evening && h < 12)) h += 12; r.time = pad(h) + ':00'; }) ||
    take('at\\s+(\\d{1,2})', m => { let h = +m[2]; if (h > 12 || h < 1) return false; if (h <= 7) h += 12; r.time = pad(h) + ':00'; });
  // dates
  if (!r.date) {
    take('(today|tod|aaj)', () => { r.date = today(); }) ||
      take('(day\\s+after\\s+tomorrow|parso|parson)', () => { r.date = addDays(today(), 2); }) ||
      take('(tomorrow|tmrw|tmr|kal)', () => { r.date = addDays(today(), 1); }) ||

function vInsights(arg) {

  const hmax = Math.max(1, ...heat.flat()); const htotal = heat.flat().reduce((a, b) => a + b, 0);
  const slots = ['8 AM', '10 AM', '12 PM', '2 PM', '4 PM', '6 PM'], slotsEnd = ['10 AM', '12 PM', '2 PM', '4 PM', '6 PM', 'late'];
  const colSum = [0, 1, 2, 3, 4, 5].map(c => heat.reduce((a, r) => a + r[c], 0)); const bestC = colSum.indexOf(Math.max(...colSum));
  const power = htotal >= 8 ? (bestC === 5 ? 'after 6 PM' : `${slots[bestC]} to ${slotsEnd[bestC]}`) : '';
  // planned vs done (last 7 days)
  const pv = []; for (let i = 6; i >= 0; i--) { const d = addDays(td, -i); const ids = S.plan[d] || []; const planned = ids.length; const done = S.tasks.filter(t => t.done && t.doneAt && ymd(new Date(t.doneAt)) === d && (ids.includes(t.id) || ids.includes(t.orig))).length; pv.push({ d, planned: Math.max(planned, done), done }); }
  const pTot = pv.reduce((a, x) => a + x.planned, 0), dTot = pv.reduce((a, x) => a + x.done, 0);
  const rate = pTot ? Math.round(dTot / pTot * 100) : 0; const pmax = Math.max(1, ...pv.map(x => x.planned));
  const daysWithPlan = pv.filter(x => x.planned).length || 1; const avgP = pTot / daysWithPlan, avgD = dTot / daysWithPlan;

    if (power) head += ` You get the most done ${power}, so keep that time free.`;

  }

  <div class="pad" style="display:flex;align-items:baseline;justify-content:space-between"><h1 class="title">Insights</h1><span class="muted" style="font-size:14px;font-weight:600">${fmtShort(from)} to ${fmtShort(td)}</span></div>

function render() {
  const { view, arg } = route();
  const V = { home: vHome, today: vToday, inbox: vInbox, upcoming: vUpcoming, someday: vSomeday, project: () => vProject(arg), done: vDone, habits: vHabits, focus: vFocus, insights: () => vInsights(arg), settings: () => vSettings(arg), search: () => vSearch(arg) };
  const fn = V[view] || vHome;
  $('#main').innerHTML = (view === 'home' && isWide()) ? vToday() : fn();
  renderSide();
  $('#fab').style.display = ['settings', 'focus', 'insights', 'habits'].includes(view) ? 'none' : '';
  wire(view);
  document.title = 'Sankalp';
}
function wire(view) {
  const si = $('#searchIn'); if (si) si.onkeydown = e => { if (e.key === 'Enter' && si.value.trim()) go('search/' + encodeURIComponent(si.value.trim())); };
  if (view === 'focus') { const s = $('#tTask'); if (s) s.onchange = () => { S.timer.taskId = s.value; save(); }; }
  if (view === 'settings') {
    $('#setMorning').onchange = e => { S.settings.morning = e.target.value || '08:30'; save(); };
    $('#setMeetBefore').onchange = e => { S.settings.meetBefore = +e.target.value; save(); };
    $('#setPomo').onchange = e => { S.settings.pomo = Math.min(120, Math.max(5, +e.target.value || 25)); if (!S.timer.running && S.timer.mode === 'work') S.timer.left = S.settings.pomo * 60; save(); };
    $('#setBrk').onchange = e => { S.settings.brk = Math.min(60, Math.max(1, +e.target.value || 5)); save(); };
    $('#msId').onchange = e => { S.settings.msClientId = e.target.value.trim(); msal = null; save(); render(); };
  }
  $$('.row').forEach(swipe);
}
/* swipe: right = complete, left = reschedule */
function swipe(el) {
  let x0 = 0, y0 = 0, dx = 0, on = false, locked = false;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; dx = 0; on = true; locked = false; }, { passive: true });
  el.addEventListener('touchmove', e => {
    if (!on) return; const t = e.touches[0]; const ddx = t.clientX - x0, ddy = t.clientY - y0;
    if (!locked) { if (Math.abs(ddy) > 10 && Math.abs(ddy) > Math.abs(ddx)) { on = false; return; } if (Math.abs(ddx) > 10) locked = true; else return; }
    dx = ddx; el.classList.add('dragging'); el.style.transform = `translateX(${dx}px)`;
    el.style.background = dx > 0 ? 'color-mix(in srgb,var(--accent) 22%,var(--bg))' : 'color-mix(in srgb,var(--meet) 14%,var(--bg))';
  }, { passive: true });
  el.addEventListener('touchend', () => {
    if (!on) return; on = false; el.classList.remove('dragging'); el.style.transform = ''; el.style.background = '';
    const id = el.dataset.id;
    if (dx > 90) toggleDone(id); else if (dx < -90) scheduleMenu(id);
  });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'done') { e.preventDefault(); const insheet = b.closest('#sheet'); toggleDone(id); if (insheet) closeSheet(); }
  else if (a === 'open') taskSheet(id);
  else if (a === 'nav') go(b.dataset.to);
  else if (a === 'delete') deleteTask(id);
  else if (a === 'moveoverdue') { const td = today(); todayLists().overdue.forEach(t => setDate(t, td)); save(); render(); toast('Moved to today'); }
  else if (a === 'newproject') projectForm();
  else if (a === 'editproject') projectForm(id);
  else if (a === 'newhabit') habitForm();
  else if (a === 'edithabit') habitForm(id);
  else if (a === 'habit') { const x = S.habits.find(h => h.id === id); const k = today(); if (x.log[k]) delete x.log[k]; else x.log[k] = 1; save(); render(); }
  else if (a === 'tstart') startTimer();
  else if (a === 'tpause') pauseTimer();
  else if (a === 'treset') resetTimer();
  else if (a === 'tmode') resetTimer(b.dataset.m);
  else if (a === 'focusTask') { S.timer.taskId = id; if (!S.timer.running) resetTimer('work'); closeSheet(); go('focus'); }
  else if (a === 'dotoday') { const t = getTask(id); t.date = today(); t.someday = false; t.pushed = 0; addPlan(t); save(); render(); toast('Moved to today'); }
  else if (a === 'drop') deleteTask(id);
  else if (a === 'theme') { S.settings.theme = b.dataset.t; save(); applyTheme(); render(); }
  else if (a === 'mode') { S.settings.mode = b.dataset.m; save(); applyTheme(); render(); }
  else if (a === 'asknotif') askNotify(true);
  else if (a === 'testnotif') notify('Sankalp reminders are on', 'This is how a task reminder will look.', 'test', { id: '' }, true);
  else if (a === 'msin') msConnect();
  else if (a === 'msout') msDisconnect();
  else if (a === 'sync') syncMeetings(true);
  else if (a === 'export') exportData();
  else if (a === 'import') $('#importFile').click();
  else if (a === 'reset') { if (confirm('Erase all tasks, habits and settings on this device? Download a backup first if you need one.')) { localStorage.removeItem(KEY); S = seed(); save(); applyTheme(); go('home'); render(); } }
});
$('#fab').onclick = quickAdd;

/* ---------- backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `sankalp-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const s = JSON.parse(rd.result); if (!s || s.v !== 1 || !Array.isArray(s.tasks)) throw 0; if (!confirm('Replace everything on this device with this backup?')) return; S = migrate(s); save(); applyTheme(); render(); toast('Backup restored'); } catch (err) { toast('That file is not a Sankalp backup'); } };
  rd.readAsText(f); e.target.value = '';
};

/* ---------- notifications ---------- */
let swReg = null;
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => { });
  navigator.serviceWorker.addEventListener('message', e => handleAction(e.data));
}
function handleAction(d) {
  if (!d || !d.type) return; const t = getTask(d.id);
  if (d.type === 'done' && t && !t.done) toggleDone(d.id);
  if (d.type === 'snooze' && t) { t.snoozeUntil = Date.now() + 10 * 6e4; save(); toast('Snoozed for 10 minutes'); }
  if (d.type === 'open' && t) taskSheet(d.id);
}
function askNotify(explicit) {
  if (!('Notification' in window)) { if (explicit) toast('Add Sankalp to your Home Screen to get reminders'); return; }
  if (Notification.permission === 'default') Notification.requestPermission().then(() => { if (route().view === 'settings') render(); });
  else if (explicit && Notification.permission === 'denied') toast('Notifications are blocked for this site in browser settings');
}
async function notify(title, body, tag, data = {}, actions) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const opts = { body, tag, data, icon: 'icon-192.png', badge: 'icon-192.png', renotify: true };
  if (actions) opts.actions = [{ action: 'done', title: 'Done' }, { action: 'snooze', title: 'Snooze 10 min' }];
  try { const reg = swReg || await navigator.serviceWorker?.getRegistration(); if (reg) { await reg.showNotification(title, opts); return; } } catch (e) { }
  try { new Notification(title, { body, tag }); } catch (e) { }
}
function tick() {
  const now = Date.now(), td = today(); let changed = false;
  S.tasks.forEach(t => {
    if (t.done) return;
    if (t.snoozeUntil && now >= t.snoozeUntil) { t.snoozeUntil = 0; changed = true; notify(t.title, 'Snoozed reminder', 't' + t.id, { id: t.id }, true); return; }
    if (!t.date || !t.time || t.remind == null) return;
    const at = pYmd(t.date); const [h, m] = t.time.split(':').map(Number); at.setHours(h, m - t.remind, 0, 0);
    const key = t.date + t.time + t.remind;
    if (t.fired !== key && now >= at.getTime() && now - at.getTime() < 3 * 3600e3) {
      t.fired = key; changed = true;
      const p = proj(t.projectId);
      notify(t.title, (t.remind ? `In ${fmtMins(t.remind)}, at ` : 'Now, ') + fmtTime(t.time) + (p ? `. ${p.name}` : ''), 't' + t.id, { id: t.id }, true);
    }
  });
  const mb = S.settings.meetBefore;
  if (mb) meetingsOn(td).forEach(m => { const k = 'm' + m.id + m.s; if (!S.fired[k] && now >= m.s - mb * 6e4 && now < m.s + 5 * 6e4) { S.fired[k] = 1; changed = true; notify(m.t, `Starts at ${fmtClock(m.s)}`, k, { url: m.join || '' }); } });
  const wd = new Date().getDay(), hm = nowHM();
  S.habits.forEach(x => { if (!x.time || !x.days.includes(wd) || x.log[td]) return; const k = 'h' + x.id + td; if (!S.fired[k] && hm >= x.time) { S.fired[k] = 1; changed = true; notify(x.name, `Habit reminder. Streak: ${habitStreak(x)} days`, k); } });
  if (S.settings.lastSummary !== td && hm >= S.settings.morning && hm < '12:00') {
    S.settings.lastSummary = td; changed = true; const tl = todayLists(); const n = tl.day.length + tl.evening.length + tl.overdue.length; const mm = meetingsOn(td).length;
    notify('Good morning', `${n} ${n === 1 ? 'task' : 'tasks'}${mm ? ` and ${mm} ${mm === 1 ? 'meeting' : 'meetings'}` : ''} today.${tl.overdue.length ? ` ${tl.overdue.length} overdue.` : ''}`, 'summary');
  }
  // prune fired keys older than 3 days
  if (Math.random() < .05) Object.keys(S.fired).forEach(k => { if (k.length > 40) delete S.fired[k]; });
  if (changed) save();
}
setInterval(tick, 20000);
setInterval(() => {
  if (S.timer.running && Date.now() >= S.timer.endAt) finishTimer();
  const el = $('#tText'); if (el) { const l = timerLeft(); el.textContent = `${pad(Math.floor(l / 60))}:${pad(l % 60)}`; const ring = $('#tRing'); const tot = (S.timer.mode === 'work' ? S.settings.pomo : S.settings.brk) * 60; const C = 2 * Math.PI * 116; if (ring) ring.setAttribute('stroke-dasharray', `${(C * l / tot).toFixed(1)} ${C.toFixed(1)}`); }
}, 1000);
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { tick(); if (today() !== lastDay) { lastDay = today(); } render(); maybeSync(); } });
setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } else if (route().view === 'today' || (route().view === 'home' && isWide())) { const nl = $('.bar'); if (nl && document.visibilityState === 'visible' && !$('#sheet').classList.contains('on')) render(); } }, 60000);

/* ---------- Outlook (Microsoft Graph, read-only) ---------- */
const MSAL_SRC = 'https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js';
let msal = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function msInit() {
  if (!S.settings.msClientId) return null; if (msal) return msal;
  try {
    if (!window.msal) await loadScript(MSAL_SRC);
    const m = new window.msal.PublicClientApplication({ auth: { clientId: S.settings.msClientId, authority: 'https://login.microsoftonline.com/common', redirectUri: location.origin + location.pathname }, cache: { cacheLocation: 'localStorage' } });
    const r = await m.handleRedirectPromise();
    if (r && r.account) m.setActiveAccount(r.account);
    if (!m.getActiveAccount() && m.getAllAccounts()[0]) m.setActiveAccount(m.getAllAccounts()[0]);
    msal = m; return m;
  } catch (e) { console.warn(e); toast('Could not start Outlook sign-in. Check the client ID.'); return null; }
}
function msAccount() { return msal && msal.getActiveAccount(); }
async function msConnect() {
  const v = $('#msId')?.value.trim(); if (v) S.settings.msClientId = v; save();
  if (!S.settings.msClientId) { toast('Paste your Microsoft app ID first'); $('#msId')?.focus(); return; }
  msal = null; const m = await msInit(); if (!m) return;
  try { await m.loginRedirect({ scopes: ['Calendars.Read'] }); } catch (e) { toast('Sign-in did not start: ' + (e.errorCode || 'error')); }
}
async function msDisconnect() { const m = await msInit(); const a = m?.getActiveAccount(); S.meetLog = {}; S.settings.msSyncedAt = 0; save(); if (a) await m.logoutRedirect({ account: a, postLogoutRedirectUri: location.origin + location.pathname }); render(); }
async function syncMeetings(manual) {
  const m = await msInit(); const acc = m?.getActiveAccount(); if (!acc) { if (manual) toast('Connect Outlook in Settings first'); return; }
  let tok;
  try { tok = (await m.acquireTokenSilent({ scopes: ['Calendars.Read'], account: acc })).accessToken; }
  catch (e) { if (manual) { await m.acquireTokenRedirect({ scopes: ['Calendars.Read'], account: acc }); } return; }
  const start = new Date(); start.setHours(0, 0, 0, 0); start.setDate(start.getDate() - 1);
  const end = new Date(start); end.setDate(end.getDate() + 10);
  let url = `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${start.toISOString()}&endDateTime=${end.toISOString()}&$select=id,subject,start,end,isAllDay,isCancelled,onlineMeeting,webLink&$orderby=start/dateTime&$top=100`;
  try {
    const got = [];
    while (url && got.length < 400) { const r = await fetch(url, { headers: { Authorization: 'Bearer ' + tok } }); if (!r.ok) throw new Error('HTTP ' + r.status); const j = await r.json(); got.push(...j.value); url = j['@odata.nextLink']; }
    const ws = start.getTime(), we = end.getTime();
    Object.keys(S.meetLog).forEach(k => { const x = S.meetLog[k]; if (x.s >= ws && x.s < we) delete S.meetLog[k]; if (x.s < Date.now() - 62 * 864e5) delete S.meetLog[k]; });
    got.filter(x => !x.isCancelled).forEach(x => { S.meetLog[x.id] = { id: x.id, t: x.subject || 'Meeting', s: new Date(x.start.dateTime + 'Z').getTime(), e: new Date(x.end.dateTime + 'Z').getTime(), allDay: !!x.isAllDay, join: x.onlineMeeting?.joinUrl || '' }; });
    S.settings.msSyncedAt = Date.now(); save(); render(); if (manual) toast('Meetings updated');
  } catch (e) { if (manual) toast('Could not load meetings. Try again.'); }
}
function maybeSync() { if (S.settings.msClientId && Date.now() - S.settings.msSyncedAt > 10 * 6e4) syncMeetings(false); }

/* ---------- start ---------- */
applyTheme();
(function handleUrl() {
  const q = new URLSearchParams(location.search);
  if (q.get('done')) handleAction({ type: 'done', id: q.get('done') });
  if (q.get('snooze')) handleAction({ type: 'snooze', id: q.get('snooze') });
  if (q.get('add')) setTimeout(quickAdd, 300);
  if (q.toString() && !location.hash.includes('code=')) history.replaceState(null, '', location.pathname + location.hash);
})();
render();
if (S.settings.msClientId) msInit().then(() => { render(); maybeSync(); });
tick();
</script>
