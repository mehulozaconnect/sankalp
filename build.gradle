plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.mehul.sankalp'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mehul.sankalp'
        minSdk 26
        targetSdk 34
        versionCode runNo
        versionName "1.0." + runNo
    }

    signingConfigs {
        release {
            storeFile file('sankalp.jks')
            storePassword 'sankalp-app'
            keyAlias 'sankalp'
            keyPassword 'sankalp-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
