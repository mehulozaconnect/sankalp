name: Reminder service check
on:
  push:
    branches: [main]
    paths: ['diag/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect
        run: |
          P=dayline-226fb
          set +e
          {
            J=firebase-schedule-tick-asia-south1; L="--location asia-south1 --project $P"
            echo "== fix"
            SA=776337315217-compute@developer.gserviceaccount.com; U=https://asia-south1-dayline-226fb.cloudfunctions.net/tick
            for R in asia-south1 us-central1; do
              if gcloud scheduler jobs create http dayline-tick --location $R --project $P --schedule='* * * * *' --time-zone=Asia/Kolkata --uri=$U --http-method=POST --oidc-service-account-email=$SA --oidc-token-audience=$U --attempt-deadline=60s 2>&1; then echo "created in $R"; sleep 10; gcloud scheduler jobs run dayline-tick --location $R --project $P 2>&1; break; fi
              gcloud scheduler jobs delete dayline-tick --location $R --project $P --quiet 2>&1
            done
            sleep 150
            echo "== job after"; gcloud scheduler jobs list --location asia-south1 --project $P 2>&1; gcloud scheduler jobs list --location us-central1 --project $P 2>&1; gcloud scheduler jobs describe $J $L --format='value(state,status,lastAttemptTime,scheduleTime)' 2>&1
            echo "== tick logs"; gcloud logging read 'timestamp>="'$(date -u -d '-4 min' +%FT%TZ)'" AND (resource.type="cloud_run_revision" OR resource.type="cloud_scheduler_job")' --project $P --limit 40 --format='value(timestamp,resource.type,severity,textPayload,jsonPayload.message,jsonPayload.status,httpRequest.status)' 2>&1
          } > out.txt
          git config user.name bot; git config user.email bot@example.invalid
          git checkout -B diag-out; git add -f out.txt; git commit -qm out; git push -f origin diag-out
