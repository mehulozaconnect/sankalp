name: Reminder service check
on:
  push:
    branches: [main]
    paths: ['diag/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect
        run: |
          P=dayline-226fb
          set +e
          {
            T=$(gcloud auth print-access-token)
            echo "== release"; curl -sS -H "Authorization: Bearer $T" "https://firebaserules.googleapis.com/v1/projects/$P/releases" | head -30
            R=$(curl -sS -H "Authorization: Bearer $T" "https://firebaserules.googleapis.com/v1/projects/$P/releases/cloud.firestore" | grep -o '"rulesetName": "[^"]*' | cut -d'"' -f4)
            echo "== ruleset $R"; curl -sS -H "Authorization: Bearer $T" "https://firebaserules.googleapis.com/v1/$R" | head -40
          } > out.txt
          git config user.name bot; git config user.email bot@example.invalid
          git checkout -B diag-out; git add -f out.txt; git commit -qm out; git push -f origin diag-out
