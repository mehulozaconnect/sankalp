name: Reminder service check
on:
  push:
    branches: [main]
    paths: ['diag/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect
        run: |
          P=dayline-226fb
          set +e
          {
            npx -y firebase-tools@15 apps:list WEB --project $P 2>&1 | tail -8
            ID=$(npx -y firebase-tools@15 apps:list WEB --project $P --json 2>/dev/null | grep -o '"appId": *"[^"]*' | head -1 | cut -d'"' -f4)
            npx -y firebase-tools@15 apps:sdkconfig WEB $ID --project $P 2>&1 | tail -15
          } > out.txt
          git config user.name bot; git config user.email bot@example.invalid
          git checkout -B diag-out; git add -f out.txt; git commit -qm out; git push -f origin diag-out
