name: Reminder service check
on:
  push:
    branches: [main]
    paths: ['diag/**']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Collect
        run: |
          P=dayline-226fb
          set +e
          {
            T=$(gcloud auth print-access-token); B=https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents
            echo "== pub"; curl -sS -H "Authorization: Bearer $T" "$B/pub" | grep -E '"name"|integerValue|"t"' | head
            echo "== pushq"; curl -sS -H "Authorization: Bearer $T" "$B/pushq" | grep -E '"name"|"u"|integerValue' | head
            echo "== users"; curl -sS -H "Authorization: Bearer $T" "$B/users?mask.fieldPaths=x" | grep '"name"' | head
            for U in $(curl -sS -H "Authorization: Bearer $T" "$B/users?mask.fieldPaths=x" | grep -o 'users/[A-Za-z0-9]*' | sort -u; curl -sS -H "Authorization: Bearer $T" -X POST "$B:listCollectionIds" -d '{}' >/dev/null); do echo "subs of $U"; curl -sS -H "Authorization: Bearer $T" "$B/pushq/${U#users/}/subs" | grep -E '"name"|stringValue' | cut -c1-120 | head; done
            echo "== act/kick logs"; gcloud logging read 'timestamp>="'$(date -u -d '-30 min' +%FT%TZ)'" AND resource.type="cloud_run_revision" AND resource.labels.service_name="act"' --project $P --limit 20 --format='value(timestamp,severity,httpRequest.status,httpRequest.requestMethod,textPayload)' 2>&1
          } > out.txt
          git config user.name bot; git config user.email bot@example.invalid
          git checkout -B diag-out; git add -f out.txt; git commit -qm out; git push -f origin diag-out
